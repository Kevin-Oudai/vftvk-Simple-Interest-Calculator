<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Interest Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Main container for the calculator -->
    <main class="maindiv">
      <h1>Simple Interest Calculator</h1>

      <!-- Form section for user inputs -->
      <section class="container">
        <!-- Deposit amount -->
        <div>
          <label for="principal">Amount</label>
          <input type="number" id="principal" />
          <span id="principal-error" class="error"></span>
        </div>

        <!-- Currency selector -->
        <div>
          <label for="currency">Currency</label>
          <select id="currency">
            <option value="$">$</option>
            <option value="TT$">TT$</option>
            <option value="£">£</option>
          </select>
        </div>

        <!-- Interest rate slider -->
        <div>
          <label for="rate">Interest Rate</label>
          <div>
            <input
              type="range"
              id="rate"
              min="1"
              max="20"
              step="0.25"
              value="10.25"
              oninput="updateRate()"
            />
            <span id="rate_val">10.25%</span>
          </div>
          <span id="rate-error" class="error"></span>
        </div>

        <!-- Time in years -->
        <div>
          <label for="time">No. of Years</label>
          <select id="time">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
          <span id="time-error" class="error"></span>
        </div>

        <!-- Interest calculation type -->
        <div>
          <label>Interest Type</label>
          <div>
            <label
              ><input
                type="radio"
                name="interestType"
                value="simple"
                checked
              />
              Simple</label
            >
            <label
              ><input type="radio" name="interestType" value="compound" />
              Compound</label
            >
          </div>
        </div>

        <!-- Buttons -->
        <div>
          <button id="button" onclick="compute()">Compute Interest</button>
          <button type="button" id="reset" onclick="resetForm()">Reset</button>
        </div>

        <!-- Display area for results -->
        <div>
          <span id="result"></span>
        </div>
      </section>

      <!-- Footer information -->
      <footer>&#169; Everyone Can Get Rich</footer>
    </main>
  </body>
</html>
